                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: configuration
                  type: TEXT
                  constraints:
                    nullable: true
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
  - changeSet:
      id: 20250725192006-create-measurement-unit-table
      author: warmhouse
      preConditions:
        - onFail: MARK_RAN
        - not:
          tableExists:
            tableName: measurement_units
      changes:
        - createTable:
            tableName: measurement_units
            columns:
              - column:
                  name: unit_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
                  constraints:
                    nullable: true
  - changeSet:
      id: 20250725192007-create-telemetry-data-table
      author: warmhouse
      preConditions:
        - onFail: MARK_RAN
        - not:
          tableExists:
            tableName: telemetry_data
      changes:
        - createTable:
            tableName: telemetry_data
            columns:
              - column:
                  name: telemetry_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: device_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_telemetry_device
                    references: devices(device_id)
                    deleteCascade: true
              - column:
                  name: unit_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_telemetry_unit
                    references: measurement_units(unit_id)
                    deleteCascade: true
              - column:
                  name: value
                  type: DOUBLE PRECISION
                  constraints:
                    nullable: false
              - column:
                  name: timestamp
                  type: TIMESTAMP
                  constraints:
                    nullable: false
  - changeSet:
