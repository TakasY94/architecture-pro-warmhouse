              - column:
                  name: device_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_scenario_device_device
                    references: devices(device_id)
                    deleteCascade: true
            constraints:
              - primaryKey:
                  columns: [scenario_id, device_id]