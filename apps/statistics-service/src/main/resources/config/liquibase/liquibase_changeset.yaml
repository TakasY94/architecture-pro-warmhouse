                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_scenario_user
                    references: users(user_id)
                    deleteCascade: true
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
                  constraints:
                    nullable: true
              - column:
                  name: is_active
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
  - changeSet:
      id: 20250725192009-create-module-device-table
      author: warmhouse
      preConditions:
        - onFail: MARK_RAN
        - not:
          tableExists:
            tableName: module_devices
      changes:
        - createTable:
            tableName: module_devices
            columns:
              - column:
                  name: module_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_module_device_module
                    references: modules(module_id)
                    deleteCascade: true
              - column:
                  name: device_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_module_device_device
                    references: devices(device_id)
                    deleteCascade: true
            constraints:
              - primaryKey:
                  columns: [module_id, device_id]
  - changeSet:
      id: 20250725192010-create-scenario-device-table
      author: warmhouse
      preConditions:
        - onFail: MARK_RAN
