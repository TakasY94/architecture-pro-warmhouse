databaseChangeLog:
  - changeSet:
      id: 20250725192001-create-user-table
      author: warmhouse
      preConditions:
        - onFail: MARK_RAN
        - not:
          tableExists:
            tableName: users
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: user_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
  - changeSet:
      id: 20250725192002-create-house-table
      author: warmhouse
      preConditions:
        - onFail: MARK_RAN
        - not:
          tableExists:
            tableName: houses
      changes:
        - createTable:
            tableName: houses
            columns:
              - column:
                  name: house_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_house_user
                    references: users(user_id)
                    deleteCascade: true
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: address
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
  - changeSet:
      id: 20250725192003-create-device-type-table
      author: warmhouse
      preConditions:
        - onFail: MARK_RAN
        - not:
          tableExists:
            tableName: device_types
      changes:
        - createTable:
            tableName: device_types
            columns:
              - column:
                  name: device_type_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: type_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
                  constraints:
                    nullable: true
  - changeSet:
      id: 20250725192004-create-device-table
      author: warmhouse
      preConditions:
        - onFail: MARK_RAN
        - not:
          tableExists:
            tableName: devices
      changes:
        - createTable:
            tableName: devices
            columns:
              - column:
                  name: device_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: house_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_device_house
                    references: houses(house_id)
                    deleteCascade: true
              - column:
                  name: device_type_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_device_type
                    references: device_types(device_type_id)
                    deleteCascade: true
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
  - changeSet:
      id: 20250725192005-create-module-table
      author: warmhouse
      preConditions:
        - onFail: MARK_RAN
        - not:
          tableExists:
            tableName: modules
      changes:
        - createTable:
            tableName: modules
